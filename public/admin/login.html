<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EvaWarm Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset ─────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Page — EvaWarm dark background + mesh gradients ──────────────── */
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #060b17;
      background-image:
        radial-gradient(ellipse 85% 75% at 5%  10%, rgba(6, 182, 212, 0.13)  0%, transparent 55%),
        radial-gradient(ellipse 60% 60% at 95%  8%, rgba(139, 92, 246, 0.09)  0%, transparent 50%),
        radial-gradient(ellipse 65% 55% at 58% 95%, rgba(245, 158, 11,  0.06) 0%, transparent 50%);
      color: #c4d0ee;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Card ─────────────────────────────────────────────────────────── */
    .card {
      width: 100%;
      max-width: 420px;
      margin: 24px;
      padding: 48px 40px 44px;
      background: #0f1b30;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 16px;
      box-shadow:
        0 24px 64px rgba(0, 0, 0, 0.45),
        0 0 0 1px rgba(6, 182, 212, 0.04);
    }

    /* ── Logo area ────────────────────────────────────────────────────── */
    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
    }

    .portal-label {
      text-align: center;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: #6e7e9e;
      margin-bottom: 36px;
    }

    /* ── Divider ──────────────────────────────────────────────────────── */
    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.06);
      margin-bottom: 28px;
    }

    /* ── Error banner ─────────────────────────────────────────────────── */
    .error-banner {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      margin-bottom: 20px;
      background: rgba(239, 68, 68, 0.07);
      border: 1px solid rgba(239, 68, 68, 0.22);
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.4;
      color: #fca5a5;
    }
    .error-banner.visible { display: flex; }

    .error-icon {
      flex-shrink: 0;
      width: 15px;
      height: 15px;
      color: #f87171;
    }

    /* ── Form fields ──────────────────────────────────────────────────── */
    .field { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #6e7e9e;
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 13px 16px;
      background: #0b1324;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      color: #edf0ff;
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
    }

    input[type="text"]::placeholder,
    input[type="password"]::placeholder {
      color: #3a4762;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: rgba(6, 182, 212, 0.45);
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.07);
    }

    /* ── Submit button ────────────────────────────────────────────────── */
    .btn-submit {
      width: 100%;
      margin-top: 10px;
      padding: 14px 20px;
      background: linear-gradient(120deg, #06b6d4 0%, #22d3ee 100%);
      border: none;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: #060b17;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: opacity 0.18s, transform 0.1s;
    }

    .btn-submit:hover  { opacity: 0.9; }
    .btn-submit:active { transform: scale(0.987); }

    /* ── Footer note ──────────────────────────────────────────────────── */
    .footer-note {
      margin-top: 28px;
      text-align: center;
      font-size: 11px;
      color: #3a4762;
      letter-spacing: 0.02em;
    }

    /* ── Responsive ───────────────────────────────────────────────────── */
    @media (max-width: 480px) {
      .card { padding: 36px 24px 36px; }
    }
  </style>
</head>

    </div>

    <p class="portal-label">Admin Portal</p>

    <div class="divider"></div>

    <!-- Error banner — hidden by default, shown via JS when ?error=1 is present -->
    <div class="error-banner" id="errorBanner" role="alert" aria-live="polite">
      <svg class="error-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5"/>
        <path d="M8 4.75V8.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="8" cy="11" r="0.875" fill="currentColor"/>
      </svg>
      Invalid username or password. Please try again.
    </div>

    <!-- Login form — posts to the Vercel Serverless Function -->
    <form method="POST" action="/api/admin-login" autocomplete="on">

      <div class="field">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          autocomplete="username"
          spellcheck="false"
          required
          placeholder="Your username"
        />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          required
          placeholder="Your password"
        />
      </div>

      <button type="submit" class="btn-submit">Sign in</button>

    </form>

    <p class="footer-note">Access restricted to authorised users.</p>

  </div><!-- /.card -->

  <script>
    // Show the error banner when the server redirects back with ?error=1.
    // Only the URL query parameter is read — no credentials, cookies, or
    // server responses are ever accessed by this script.
    (function () {
      var params = new URLSearchParams(window.location.search)
      if (params.get('error') === '1') {
        var banner = document.getElementById('errorBanner')
        if (banner) {
          banner.classList.add('visible')
          // Focus the username field so the user can re-enter credentials
          var usernameInput = document.getElementById('username')
          if (usernameInput) usernameInput.focus()
        }
      }
    }())
  </script>
</body>
</html>
